name: CI/CD

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  ci-cd:
    name: CI/CD
    uses: StudioLE/Actions/.github/workflows/ci-cd-rust.yml@v8
    with:
      package_name: photo_sort
      binary_name: photo_sort
      brew_repo: StudioLE/homebrew-tap
      brew_formula_file: .github/brew/formula.template.rb
    secrets:
      cargo_registry_token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      brew_repo_token: ${{ secrets.BREW_REPO_TOKEN }}
